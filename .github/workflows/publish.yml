name: Publish to npm

on:
  release:
    types:
      - published

permissions:
  contents: read
  id-token: write

concurrency:
  group: npm-publish-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish package
    runs-on: ubuntu-latest

    steps:
      - name: Checkout release
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false

      - name: Update npm
        run: npm install --global npm@latest

      - name: Verify release tag
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          node --input-type=module <<'EOF'
          import { readFileSync } from "node:fs";

          const tag = process.env.RELEASE_TAG;
          const version = JSON.parse(readFileSync("package.json", "utf8")).version;

          if (!/^v\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?$/.test(tag)) {
            throw new Error(`Release tag "${tag}" must have the form vX.Y.Z`);
          }

          if (tag.slice(1) !== version) {
            throw new Error(
              `Release tag "${tag}" does not match package version "${version}"`
            );
          }

          console.log(`Publishing timeweb-mcp@${version}`);
          EOF

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Verify package
        run: npm run verify

      - name: Publish package
        run: npm publish --ignore-scripts
