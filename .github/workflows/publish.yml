name: Publish to npm

on:
  push:
    branches:
      - main
    paths:
      - package.json

permissions:
  contents: write
  id-token: write

concurrency:
  group: npm-publish-main
  cancel-in-progress: false

jobs:
  publish:
    name: Tag and publish package
    runs-on: ubuntu-latest

    steps:
      - name: Checkout main
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false

      - name: Detect version change
        id: version
        env:
          BEFORE_SHA: ${{ github.event.before }}
        run: node scripts/release-version.mjs

      - name: Skip unchanged version
        if: steps.version.outputs.changed != 'true'
        run: |
          echo "package.json version is unchanged (${{ steps.version.outputs.version }}); nothing to publish"

      - name: Update npm
        if: steps.version.outputs.changed == 'true'
        run: npm install --global npm@11

      - name: Check npm registry
        id: registry
        if: steps.version.outputs.changed == 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          node --input-type=module <<'EOF'
          import { appendFileSync } from "node:fs";

          const version = process.env.VERSION;
          const response = await fetch(
            `https://registry.npmjs.org/timeweb-mcp/${encodeURIComponent(version)}`
          );

          if (response.status !== 200 && response.status !== 404) {
            throw new Error(
              `npm registry returned ${response.status} ${response.statusText}`
            );
          }

          const published = response.status === 200;
          appendFileSync(
            process.env.GITHUB_OUTPUT,
            `published=${String(published)}\n`
          );
          console.log(
            published
              ? `timeweb-mcp@${version} is already published`
              : `timeweb-mcp@${version} is ready to publish`
          );
          EOF

      - name: Install dependencies
        if: steps.version.outputs.changed == 'true'
        run: npm ci --ignore-scripts

      - name: Verify package
        if: steps.version.outputs.changed == 'true'
        run: npm run verify

      - name: Create release tag
        if: steps.version.outputs.changed == 'true'
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          git fetch --tags --force

          if git rev-parse --verify --quiet "refs/tags/$TAG" > /dev/null; then
            TAG_SHA="$(git rev-list -n 1 "$TAG")"
            if [ "$TAG_SHA" != "$GITHUB_SHA" ]; then
              echo "Tag $TAG already points to $TAG_SHA, expected $GITHUB_SHA" >&2
              exit 1
            fi

            echo "Tag $TAG already points to the current commit"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag --annotate "$TAG" --message "Release $TAG"
            git push origin "refs/tags/$TAG"
          fi

      - name: Publish package
        if: steps.version.outputs.changed == 'true' && steps.registry.outputs.published != 'true'
        run: npm publish --ignore-scripts

      - name: Create GitHub Release
        if: steps.version.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "GitHub Release $TAG already exists"
          else
            gh release create "$TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --verify-tag \
              --title "$TAG" \
              --generate-notes
          fi
